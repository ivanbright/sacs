[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sacs"
version = "0.1.0"
description = "SACS - Smart Academic Coordination System: a real-time multi-tenant school coordination platform with a one-command live demo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ivanbright" }]
keywords = ["education", "school", "timetable", "multi-tenant", "fastapi", "realtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "email-validator>=2.0",
    "tzdata>=2024.1; platform_system != 'Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "build>=1.0", "twine>=5.0"]
postgres = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/ivanbright/sacs"
Repository = "https://github.com/ivanbright/sacs"
Issues = "https://github.com/ivanbright/sacs/issues"
Changelog = "https://github.com/ivanbright/sacs/blob/main/CHANGELOG.md"

[project.scripts]
sacs = "sacs.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sacs", "sacs.*"]

[tool.setuptools.package-data]
sacs = ["migrations/*", "migrations/versions/*", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
